name: Actualizar precios Repsol 95

on:
  schedule:
    # GitHub retrasa y salta ejecuciones programadas; se pide cada 15 minutos
    # para asegurar que haya datos nuevos al menos una vez por hora.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Descargar precios del Ministerio
        run: python3 scripts/fetch.py
      - name: Guardar cambios
        run: |
          git config user.name "precios-bot"
          git config user.email "precios-bot@users.noreply.github.com"
          git add data/repsol.json
          git diff --cached --quiet || git commit -m "Precios $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q || true
          git push || echo "::warning::No se pudo guardar; se reintentará en la siguiente ejecución."
      - name: Republicar la web
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
